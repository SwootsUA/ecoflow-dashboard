<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swoots EcoFlow</title>
  <link rel="icon" href="{{ asset('favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ asset('style.css') }}">
</head>
<body>
  <nav>
    <a href="/" class="brand">🔋 ecoflow</a>
    <div class="nav-links">
      <a href="/live">Family page</a>
      <a href="https://admin.swoots.dev">Admin</a>
      <a href="{{ url_for('logout') }}">Logout</a>
    </div>
  </nav>

  <div class="container">
    <p id="updated" class="updated">Loading…</p>

    <div class="stats" id="stats"></div>

    <div class="row range">
      <button class="btn btn-sm" data-hours="1">1h</button>
      <button class="btn btn-sm" data-hours="6">6h</button>
      <button class="btn btn-sm active" data-hours="24">24h</button>
      <button class="btn btn-sm" data-hours="168">7d</button>
      <button class="btn btn-sm" data-hours="720">30d</button>
      <a class="btn btn-sm btn-ghost" id="csv" href="/api/readings.csv?hours=24">CSV</a>
    </div>

    <div class="card">
      <h2>Battery, % <span id="battery-note"></span></h2>
      <div class="chart"><canvas id="chart-level"></canvas></div>
    </div>
    <div class="card">
      <h2>Power, W <span id="power-note"></span></h2>
      <div class="chart"><canvas id="chart-power"></canvas></div>
    </div>
    <div class="card">
      <h2>Grid, V <span>0 = outage</span></h2>
      <div class="chart"><canvas id="chart-grid"></canvas></div>
    </div>

    <div class="card">
      <h2>Inverter, °C <span id="inverter-note"></span></h2>
      <div class="chart"><canvas id="chart-inverter"></canvas></div>
    </div>

    <div class="card">
      <h2>Station settings <span>sent over Bluetooth, applied in a few seconds</span></h2>
      <form id="settings" class="row settings">
        <label>Cut-off, % <input type="number" name="battery_charge_limit_min" min="0" max="30" step="1" required></label>
        <label>Charge limit, % <input type="number" name="battery_charge_limit_max" min="50" max="100" step="1" required></label>
        <label>AC charging, W <input type="number" name="ac_charging_speed" min="200" max="1200" step="100" required></label>
        <button class="btn btn-sm" type="submit">Apply</button>
        <span id="settings-status" class="settings-status"></span>
      </form>
      <div class="row release">
        <button class="btn btn-sm btn-ghost" id="release" type="button">Free Bluetooth for the app (10 min)</button>
        <span id="release-status" class="settings-status"></span>
      </div>
    </div>

    <details class="card">
      <summary>All values</summary>
      <input id="filter" type="text" placeholder="Filter, e.g. usb" aria-label="Filter values">
      <table><tbody id="all"></tbody></table>
    </details>
  </div>

  <script src="{{ asset('chart.umd.min.js') }}"></script>
  <script src="{{ asset('app.js') }}"></script>
</body>
</html>
