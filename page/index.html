<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EcoFlow DELTA 2</title>
    <style>
      :root {
        --bg: #0b0f17;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --line: #22314a;
        --accent: #60a5fa;
        --out: #f59e0b;
        --good: #34d399;
        --bad: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(1200px 800px at 20% 0%, #111b33, var(--bg)) fixed;
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: var(--good);
        box-shadow: 0 0 20px rgba(52, 211, 153, 0.55);
        flex: none;
      }
      .dot.stale {
        background: var(--bad);
        box-shadow: 0 0 20px rgba(248, 113, 113, 0.55);
      }
      .title {
        font-weight: 700;
      }
      .subtitle,
      .sub,
      .note {
        color: var(--muted);
        font-size: 13px;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 18px 16px 48px;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        margin-bottom: 12px;
      }
      .label {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .value {
        font-size: 26px;
        font-weight: 700;
        margin: 4px 0 2px;
        font-variant-numeric: tabular-nums;
      }
      .value.bad {
        color: var(--bad);
      }
      .two {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 12px;
        margin-bottom: 12px;
      }
      .rows {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 16px;
        font-size: 14px;
      }
      .rows span:nth-child(odd) {
        color: var(--muted);
      }
      .rows span:nth-child(even) {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .rows .zero {
        opacity: 0.45;
      }
      .tools {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin: 22px 0 12px;
      }
      .tools h1 {
        font-size: 18px;
        margin: 0;
      }
      select,
      input,
      a.btn {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 10px;
        font: inherit;
        font-size: 14px;
        text-decoration: none;
      }
      .charts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 12px;
      }
      .chart {
        position: relative;
        height: 210px;
      }
      details {
        margin-top: 12px;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
        font-size: 15px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        margin-top: 10px;
      }
      td {
        padding: 5px 4px;
        border-top: 1px solid var(--line);
        font-variant-numeric: tabular-nums;
      }
      td:first-child {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="dot" id="dot"></div>
        <div>
          <div class="title">EcoFlow Status</div>
          <div class="subtitle">DELTA 2, read over Bluetooth once a minute</div>
        </div>
      </div>
      <div class="subtitle" id="updated">Loading…</div>
    </header>

    <main>
      <div class="cards" id="cards"></div>

      <div class="two">
        <div class="card">
          <h2>Power by port</h2>
          <div class="rows" id="ports"></div>
        </div>
        <div class="card">
          <h2>Battery</h2>
          <div class="rows" id="battery"></div>
        </div>
      </div>

      <div class="tools">
        <h1>History</h1>
        <div>
          <select id="range" aria-label="Range">
            <option value="1">1 hour</option>
            <option value="6">6 hours</option>
            <option value="24" selected>24 hours</option>
            <option value="168">7 days</option>
            <option value="720">30 days</option>
          </select>
          <a class="btn" id="csv" href="/api/readings.csv?hours=24">Download CSV</a>
        </div>
      </div>

      <div class="charts">
        <div class="card">
          <h2>Battery level, %</h2>
          <div class="chart"><canvas id="chartLevel"></canvas></div>
        </div>
        <div class="card">
          <h2>Power, W <span class="note" id="powerNote"></span></h2>
          <div class="chart"><canvas id="chartPower"></canvas></div>
        </div>
        <div class="card">
          <h2>Grid voltage, V <span class="note">0 = outage</span></h2>
          <div class="chart"><canvas id="chartGrid"></canvas></div>
        </div>
        <div class="card">
          <h2>Battery voltage, V</h2>
          <div class="chart"><canvas id="chartVolts"></canvas></div>
        </div>
        <div class="card">
          <h2>Cell temperature, °C</h2>
          <div class="chart"><canvas id="chartTemp"></canvas></div>
        </div>
      </div>

      <details class="card">
        <summary>All values</summary>
        <input id="filter" type="search" placeholder="Filter, e.g. usb" aria-label="Filter values" style="margin-top: 10px" />
        <table>
          <tbody id="all"></tbody>
        </table>
      </details>
    </main>

    <script src="/chart.js"></script>
    <script>
      const el = (id) => document.getElementById(id);
      const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      const esc = (text) => String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const num = (v, digits = 0) =>
        v == null ? "—" : Number(v).toLocaleString("en-GB", { minimumFractionDigits: digits, maximumFractionDigits: digits });
      const onOff = (v) => (v == null ? "—" : v ? "On" : "Off");
      const STALE_AFTER = 180; // seconds without a reading before the page says so
      const NO_ESTIMATE = 5939; // minutes the station reports when it has no time estimate

      function duration(minutes) {
        if (minutes == null || minutes <= 0 || minutes >= NO_ESTIMATE) return "—";
        const h = Math.floor(minutes / 60);
        return h ? `${h} h ${minutes % 60} min` : `${minutes} min`;
      }

      function ago(seconds) {
        if (seconds < 90) return `${Math.round(seconds)} s ago`;
        if (seconds < 5400) return `${Math.round(seconds / 60)} min ago`;
        return `${Math.round(seconds / 3600)} h ago`;
      }

      let last = {};

      function showLatest(d) {
        last = d;
        const age = Date.now() / 1000 - d.ts;
        const stale = age > STALE_AFTER;
        el("dot").classList.toggle("stale", stale);
        const at = new Date(d.ts * 1000).toLocaleTimeString("en-GB");
        el("updated").textContent = stale ? `No reading since ${at} (${ago(age)})` : `Updated ${at}, ${ago(age)}`;

        const gridOn = d.ac_input_voltage > 50 || d.ac_input_power > 0;
        const net = (d.input_power ?? 0) - (d.output_power ?? 0);
        let left = ["Time left", "—", "holding level"];
        if (!gridOn || net < 0) left = ["Until empty", duration(d.remaining_time_discharging), "at this load"];
        else if (net > 0) left = ["Until full", duration(d.remaining_time_charging), "at this rate"];

        const cards = [
          ["Battery", `${num(d.battery_level, 1)}%`, `limits ${num(d.battery_charge_limit_min)}–${num(d.battery_charge_limit_max)}%`],
          ["Grid", gridOn ? "On" : "Off", gridOn ? `${num(d.ac_input_voltage)} V` : "running on battery", gridOn ? "" : "bad"],
          ["Input", `${num(d.input_power)} W`, `AC ${num(d.ac_input_power)} W · XT60 ${num(d.xt60_input_power)} W`],
          ["Output", `${num(d.output_power)} W`, `AC ${num(d.ac_output_power)} W`],
          left,
          ["Cell temperature", `${num(d.cell_temperature)} °C`, `battery ${num(d.battery_voltage, 1)} V`],
        ];
        el("cards").innerHTML = cards
          .map(
            ([label, value, sub, tone]) =>
              `<div class="card"><div class="label">${label}</div><div class="value ${tone ?? ""}">${value}</div><div class="sub">${sub}</div></div>`,
          )
          .join("");

        const ports = [
          ["AC out", d.ac_output_power],
          ["USB-C 1", d.usbc_output_power],
          ["USB-C 2", d.usbc2_output_power],
          ["USB-A 1", d.usba_output_power],
          ["USB-A 2", d.usba2_output_power],
          ["Fast USB 1", d.qc_usb1_output_power],
          ["Fast USB 2", d.qc_usb2_output_power],
          ["DC out", d.dc_output_power],
        ];
        el("ports").innerHTML = ports
          .map(([label, w]) => `<span class="${w ? "" : "zero"}">${label}</span><span class="${w ? "" : "zero"}">${num(w)} W</span>`)
          .join("");

        const battery = [
          ["Voltage", `${num(d.battery_voltage, 2)} V`],
          ["Cell voltage, min–max", `${num(d.min_cell_voltage, 3)}–${num(d.max_cell_voltage, 3)} V`],
          ["AC charging speed", `${num(d.ac_charging_speed)} W`],
          ["Backup reserve", d.energy_backup ? `${num(d.energy_backup_battery_level)}%` : "Off"],
          ["AC ports", onOff(d.ac_ports)],
          ["USB ports", onOff(d.usb_ports)],
          ["12 V port", onOff(d.dc_12v_port)],
        ];
        el("battery").innerHTML = battery.map(([label, value]) => `<span>${label}</span><span>${value}</span>`).join("");
        showAll();
      }

      function showAll() {
        const want = el("filter").value.trim().toLowerCase();
        el("all").innerHTML = Object.keys(last)
          .sort()
          .filter((key) => key.includes(want))
          .map((key) => `<tr><td>${esc(key)}</td><td>${esc(last[key] ?? "—")}</td></tr>`)
          .join("");
      }

      async function loadLatest() {
        try {
          const d = await (await fetch("/api/latest")).json();
          if (d.ts) return showLatest(d);
          el("updated").textContent = "No readings yet";
        } catch {
          el("updated").textContent = "Page server not reachable";
        }
        el("dot").classList.add("stale");
      }

      const charts = {};
      const STEP = { 1: 600, 6: 3600, 24: 6 * 3600, 168: 86400, 720: 5 * 86400 }; // seconds between x ticks

      function tick(ms, hours) {
        const t = new Date(ms);
        const clock = t.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
        return hours <= 24 ? clock : t.toLocaleDateString("en-GB", { day: "2-digit", month: "2-digit" });
      }

      function draw(id, series, hours, from, to, y = {}) {
        charts[id]?.destroy();
        charts[id] = new Chart(el(id), {
          type: "line",
          data: {
            datasets: series.map(([label, color, data]) => ({
              label,
              data,
              borderColor: color,
              backgroundColor: color,
              borderWidth: 2,
              pointRadius: 0,
              pointHitRadius: 12,
              spanGaps: false,
            })),
          },
          options: {
            parsing: false,
            animation: false,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            plugins: {
              legend: { display: series.length > 1, labels: { color: css("--text"), boxWidth: 12, boxHeight: 2 } },
              tooltip: {
                callbacks: {
                  title: (items) =>
                    new Date(items[0].parsed.x).toLocaleString("en-GB", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }),
                },
              },
            },
            scales: {
              x: {
                type: "linear",
                min: from,
                max: to,
                ticks: { color: css("--muted"), maxRotation: 0, callback: (ms) => tick(ms, hours) },
                grid: { color: css("--line") },
                // ticks on round local times (every 3 hours, every midnight) instead of offsets from "now"
                afterBuildTicks: (axis) => {
                  const step = STEP[hours] * 1000;
                  const midnight = new Date(from).setHours(0, 0, 0, 0);
                  axis.ticks = [];
                  for (let t = midnight; t <= to; t += step) if (t >= from) axis.ticks.push({ value: t });
                },
              },
              y: { ticks: { color: css("--muted") }, grid: { color: css("--line") }, ...y },
            },
          },
        });
      }

      async function loadHistory() {
        const hours = Number(el("range").value);
        el("csv").href = `/api/readings.csv?hours=${hours}`;
        let h;
        try {
          h = await (await fetch(`/api/history?hours=${hours}`)).json();
        } catch {
          return;
        }
        const column = (name) => {
          const i = h.columns.indexOf(name);
          const points = [];
          let before = null;
          for (const row of h.rows) {
            // a hole in the readings stays a hole in the line
            if (before != null && row[0] - before > 2.5 * h.bucket) points.push({ x: (before + h.bucket) * 1000, y: null });
            points.push({ x: row[0] * 1000, y: i < 0 ? null : row[i] });
            before = row[0];
          }
          return points;
        };
        const mean = (points) => {
          const ys = points.map((p) => p.y).filter((y) => y != null);
          return ys.length ? Math.round(ys.reduce((a, b) => a + b, 0) / ys.length) : null;
        };
        const to = Date.now();
        const from = to - hours * 3600 * 1000;
        const blue = css("--accent");
        const input = column("input_power");
        const output = column("output_power");
        el("powerNote").textContent = `average in ${num(mean(input))}, out ${num(mean(output))}`;

        draw("chartLevel", [["Battery %", blue, column("battery_level")]], hours, from, to, { min: 0, max: 100 });
        draw("chartPower", [["In", blue, input], ["Out", css("--out"), output]], hours, from, to, { min: 0 });
        draw("chartGrid", [["Grid V", blue, column("ac_input_voltage")]], hours, from, to, { min: 0 });
        draw("chartVolts", [["Battery V", blue, column("battery_voltage")]], hours, from, to);
        draw("chartTemp", [["Cell °C", blue, column("cell_temperature")]], hours, from, to);
      }

      el("range").addEventListener("change", loadHistory);
      el("filter").addEventListener("input", showAll);
      loadLatest();
      loadHistory();
      setInterval(loadLatest, 30_000);
      setInterval(loadHistory, 300_000);
    </script>
  </body>
</html>
